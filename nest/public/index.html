<style>
/* Layout: a dark stage lit by two sweeping spotlight cones; icon rail + scrolling main on desktop,
   a phone frame with a bottom dock in mobile mode. Cards catch a cursor spotlight. Single dark look by design. */
:root{
  --stage:#07060c; --stage2:#0d0a17; --panel:#120e1f; --panel2:#191429; --panel3:#211a36;
  --line:#272040; --line2:#3b3163;
  --ink:#f2eeff; --ink2:#b4acd4; --ink3:#7c74a0;
  --neon:#ff2bd6; --cyan:#27e2ff; --lime:#c4ff3d; --amber:#ffb22e; --red:#ff4f6e; --good:#3dffa9; --violet:#9b7bff;
  --f-display:"Chakra Petch","Reem Kufi",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:dark;
}
html[lang="ar"]{--f-display:"Reem Kufi","Chakra Petch",system-ui,sans-serif}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--stage)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
svg{direction:ltr}
.kpi .v,.delta,.bignum,.hbar .vv,.mini b{direction:ltr;unicode-bidi:isolate}
.tbl td.n{direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] .tbl td.n,html[dir="rtl"] .tbl th.n{text-align:left}
html[dir="rtl"]{--flip:-1}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* stage lighting */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fx i{position:absolute;top:-35vh;width:80vw;height:160vh;opacity:.6;filter:blur(24px);transform-origin:50% 0}
.fx i:nth-child(1){left:-18vw;background:conic-gradient(from 162deg at 50% 0,transparent 0deg,rgba(255,43,214,.20) 14deg,rgba(255,43,214,.05) 26deg,transparent 36deg);animation:sweep 16s ease-in-out infinite alternate}
.fx i:nth-child(2){right:-18vw;background:conic-gradient(from 162deg at 50% 0,transparent 0deg,rgba(39,226,255,.16) 14deg,rgba(39,226,255,.04) 26deg,transparent 36deg);animation:sweep 19s ease-in-out infinite alternate-reverse}
.fx b{position:absolute;inset:auto -10% -30% -10%;height:55vh;background:radial-gradient(50% 50% at 50% 50%,rgba(155,123,255,.12),transparent 70%)}
@keyframes sweep{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){.fx i{animation:none}*{transition:none!important;animation:none!important}}

/* shell */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr}
.side{grid-row:1/3;border-inline-end:1px solid var(--line);background:linear-gradient(180deg,rgba(18,14,31,.92),rgba(7,6,12,.92));display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,rgba(255,43,214,.55),transparent 70%),var(--panel3);border:1px solid var(--line2);box-shadow:0 0 18px rgba(255,43,214,.35)}
.logo .t1{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:15px;line-height:1.1}
.logo .t2{font-size:11px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:500;position:relative}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:linear-gradient(90deg,rgba(255,43,214,.16),rgba(255,43,214,0))}
html[dir="rtl"] .nav button[aria-current="page"]{background:linear-gradient(270deg,rgba(255,43,214,.16),rgba(255,43,214,0))}
.nav button[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.side-foot{margin-top:auto;padding:12px;border:1px dashed var(--line2);border-radius:12px;font-size:12px;color:var(--ink3)}
.side-foot b{color:var(--amber);font-weight:600}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(7,6,12,.7);backdrop-filter:blur(10px)}
.top h1{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.top .crumb{font-size:12px;color:var(--ink3)}
.top .grow{flex:1}
.tg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--panel);gap:2px}
.tg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tg button svg{width:14px;height:14px}
.tg button[aria-pressed="true"]{background:var(--ink);color:var(--stage);box-shadow:0 0 14px rgba(255,255,255,.25)}
.tg button:focus-visible{outline:2px solid var(--cyan)}
select.sel{background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.top .menu-btn{display:none}

main{overflow:auto;min-width:0;padding-block:20px 60px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;border:1px solid rgba(255,178,46,.35);background:rgba(255,178,46,.07);color:#ffd590;font-size:12.5px}
.banner button{margin-inline-start:auto}

/* cards */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0),rgba(255,43,214,.10),transparent 60%)}
.card:hover::after{opacity:1}
.card h3{margin:0 0 12px;font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
html[lang="ar"] .card h3{letter-spacing:0;text-transform:none;font-size:15px}
.card h3 .r{margin-inline-start:auto;text-transform:none;letter-spacing:0;flex:none;max-width:100%}
.card h3{flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
@media(max-width:1100px){body:not(.pdfmode) .g4{grid-template-columns:repeat(2,minmax(0,1fr))}body:not(.pdfmode) .g3{grid-template-columns:repeat(2,minmax(0,1fr))}body:not(.pdfmode) .g-main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){body:not(.pdfmode) .g2,body:not(.pdfmode) .g3{grid-template-columns:minmax(0,1fr)}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:18px;align-items:stretch;padding:22px;border-radius:18px;border:1px solid var(--line2);position:relative;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,rgba(255,43,214,.20),transparent 50%),radial-gradient(90% 120% at 100% 0%,rgba(39,226,255,.13),transparent 55%),var(--panel)}
html[dir="rtl"] .hero{background:radial-gradient(120% 140% at 100% 0%,rgba(255,43,214,.20),transparent 50%),radial-gradient(90% 120% at 0% 0%,rgba(39,226,255,.13),transparent 55%),var(--panel)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--neon)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-family:var(--f-body);font-weight:600}
.hero .big{font-family:var(--f-display);font-size:clamp(38px,5vw,58px);font-weight:700;line-height:1;margin:10px 0 6px;text-shadow:0 0 28px rgba(255,43,214,.45)}
.hero p{color:var(--ink2);margin:0;max-width:44ch}
@media(max-width:900px){body:not(.pdfmode) .hero{grid-template-columns:minmax(0,1fr)}}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1100px){body:not(.pdfmode) .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 14px 12px}
.kpi .lb{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
html[lang="ar"] .kpi .lb{text-transform:none;letter-spacing:0;font-size:12.5px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.delta{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.delta.up{color:var(--good);background:rgba(61,255,169,.10)}.delta.down{color:var(--red);background:rgba(255,79,110,.10)}.delta.flat{color:var(--ink3);background:var(--panel2)}
.i{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);font-size:9.5px;color:var(--ink3);cursor:help;font-family:var(--f-mono);text-transform:none}

/* pills / chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.live{color:var(--good)}.pill.soft{color:var(--amber)}.pill.review{color:var(--cyan)}.pill.dev{color:var(--violet)}.pill.paused{color:var(--ink3)}.pill.bad{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:var(--panel)}
.chip[aria-pressed="true"]{border-color:var(--neon);color:var(--ink);background:rgba(255,43,214,.12);box-shadow:0 0 12px rgba(255,43,214,.25)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--cyan);text-shadow:0 0 12px rgba(39,226,255,.6)}

/* buttons & forms */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn svg{width:16px;height:16px}
.btn.pri{background:linear-gradient(180deg,#ff4fe0,#d61bb3);border-color:transparent;color:#fff;box-shadow:0 0 20px rgba(255,43,214,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.cy{background:rgba(39,226,255,.12);border-color:rgba(39,226,255,.5);color:var(--cyan)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--ink2);font-weight:500}
.inp{width:100%;background:var(--stage2);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13.5px}
.inp:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(39,226,255,.15)}
textarea.inp{resize:vertical;min-height:90px}
input[type=range]{width:100%;accent-color:var(--neon)}
input[type=checkbox]{accent-color:var(--neon);width:16px;height:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media(max-width:560px){body:not(.pdfmode) .form{grid-template-columns:minmax(0,1fr)}}
.meter{height:5px;border-radius:5px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--cyan)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
html[lang="ar"] .tbl th{text-transform:none;letter-spacing:0;font-size:12px}
.tbl td{padding:10px;border-bottom:1px solid rgba(39,32,64,.6);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:end;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:none}
.heat-good{color:var(--good)}.heat-ok{color:var(--amber)}.heat-bad{color:var(--red)}
td.cell{font-family:var(--f-mono);text-align:center}
td.cell span{display:inline-block;min-width:64px;padding:4px 8px;border-radius:7px}
td.cell .heat-good{background:rgba(61,255,169,.10)}td.cell .heat-ok{background:rgba(255,178,46,.10)}td.cell .heat-bad{background:rgba(255,79,110,.12)}

/* game cards */
.gcard{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .2s}
.gcard:hover{transform:translateY(-2px);border-color:var(--line2)}
.gcard .hd{display:flex;align-items:center;gap:12px}
.gico{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:#fff;position:relative}
.gname{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2}
.gmeta{font-size:12px;color:var(--ink3)}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini div{background:var(--stage2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;min-width:0}
.mini b{display:block;font-family:var(--f-mono);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{font-size:10.5px;color:var(--ink3)}
.ring{position:relative;width:54px;height:54px;flex:none;margin-inline-start:auto}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}

/* insights */
.ins{display:flex;flex-direction:column;gap:10px}
.ins .it{display:flex;gap:11px;padding:11px 12px;border-radius:11px;background:var(--stage2);border:1px solid var(--line)}
.ins .it .sv{width:4px;border-radius:4px;flex:none;align-self:stretch}
.ins .it b{display:block;font-weight:600;font-size:13.5px}
.ins .it p{margin:2px 0 0;color:var(--ink2);font-size:12.5px}

/* charts */
.chart{width:100%;min-height:60px;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.hbar{display:flex;flex-direction:column;gap:9px}
.hbar .r{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;align-items:center;gap:10px;font-size:12.5px}
.hbar .tr{height:10px;border-radius:6px;background:var(--panel3);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px}
.hbar .vv{font-family:var(--f-mono);text-align:end;font-size:12px}
#tip{position:fixed;z-index:100;pointer-events:none;background:rgba(13,10,23,.96);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 18px rgba(255,43,214,.18);max-width:260px;font-family:var(--f-body)}
#tip .tt{font-family:var(--f-mono);color:var(--ink3);font-size:11px;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between}
#tip .tr i{width:8px;height:8px;border-radius:2px}
#tip .tr b{font-family:var(--f-mono);font-weight:600}

/* kanban */
.tl-box{width:min(760px,100%)}
/* sign-in, account, connections (Netlify site) */
body.locked .app,body.locked .dock{display:none!important}
#auth-root:empty{display:none}
.auth{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;overflow:auto}
.auth-box{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 50px rgba(255,43,214,.16)}
.auth-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.auth-top .logo{display:flex;gap:10px;align-items:center}.auth-top .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#ff2bd6,#5b1a6e)}
.auth-top .t1{font-family:var(--f-display);font-weight:700;letter-spacing:.06em}.auth-top .t2{font-size:11px;color:var(--ink3)}
.auth h2{font-family:var(--f-display);font-size:20px;margin:4px 0 12px}
.form1{display:flex;flex-direction:column;gap:12px;margin:8px 0}
.form1 .field{display:flex;flex-direction:column;gap:6px}.form1 label{font-size:12px;color:var(--ink2)}
.pwwrap{display:flex;gap:6px;align-items:center}.pwwrap .inp{flex:1;min-width:0}
.pwm{margin-top:-4px}.pwbar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}.pwbar i{display:block;height:100%;border-radius:99px;transition:width .2s}
.pwrules{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:2px;font-size:12px;color:var(--ink3)}.pwrules li.ok{color:var(--good)}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.lnk{all:unset;cursor:pointer;color:var(--cyan);font-size:13px}.lnk:hover{text-decoration:underline}.lnk:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.auth-foot{margin:16px 0 0;text-align:center}
.banner.bad{border-color:rgba(255,79,110,.45);color:#ffb3c1}.banner.good{border-color:rgba(61,255,169,.4);color:#b8ffdf}

html[lang="ar"] .rp *{letter-spacing:0!important}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(3,2,8,.72);backdrop-filter:blur(6px);padding:16px}
.modal .box{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(255,43,214,.15)}
.modal h2{margin:0 0 14px;font-family:var(--f-display);font-size:19px}
.modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;z-index:120;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--stage);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 0 24px rgba(255,255,255,.3)}

.empty{text-align:center;padding:34px 16px;color:var(--ink2);border:1px dashed var(--line2);border-radius:14px}
.empty b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink3)}.small{font-size:12px}
.sec-title{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.bignum{font-family:var(--f-mono);font-size:30px;font-weight:600}
.dock{display:none}

/* responsive desktop layout: sidebar becomes a drawer */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:260px;z-index:70;transform:translateX(-105%);transition:transform .25s}
  html[dir="rtl"] .side{transform:translateX(105%)}
  .app.drawer .side{transform:none}
  .top .menu-btn{display:inline-flex}
}

/* MOBILE MODE — phone frame + bottom dock */
.app[data-layout="mobile"]{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;max-width:430px;margin:0 auto;border-inline:1px solid var(--line2);box-shadow:0 0 60px rgba(255,43,214,.12)}
.app[data-layout="mobile"] .side{display:none}
.app[data-layout="mobile"] .top .menu-btn{display:none}
.app[data-layout="mobile"] .top h1{font-size:16px}
.app[data-layout="mobile"] .top .crumb{display:none}
.app[data-layout="mobile"] .kpis,.app[data-layout="mobile"] .g4,.app[data-layout="mobile"] .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
.app[data-layout="mobile"] .g2,.app[data-layout="mobile"] .g-main,.app[data-layout="mobile"] .hero{grid-template-columns:minmax(0,1fr)}
.app[data-layout="mobile"] .kpi .v{font-size:19px}
.app[data-layout="mobile"] .hero{padding:16px}
.app[data-layout="mobile"] .form{grid-template-columns:minmax(0,1fr)}
.app[data-layout="mobile"] main{padding-bottom:24px}
.app[data-layout="mobile"] .hbar .r{grid-template-columns:84px minmax(0,1fr) 60px}
.app[data-layout="mobile"] .dock{display:flex;justify-content:space-around;border-top:1px solid var(--line2);background:rgba(10,8,18,.96);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-inline:max(4px,env(safe-area-inset-left,0px)) max(4px,env(safe-area-inset-right,0px))}
.dock button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--ink3);padding:4px 2px;min-width:44px;border-radius:8px}
.dock button svg{width:20px;height:20px}
.dock button[aria-current="page"]{color:var(--neon);text-shadow:0 0 10px var(--neon)}
.dock button[aria-current="page"] svg{filter:drop-shadow(0 0 6px var(--neon))}
/* top bar controls */
.top .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.app[data-layout="mobile"] .top{gap:8px;padding-block:10px}
.app[data-layout="mobile"] .top .grow{display:none}
.app[data-layout="mobile"] .top>div:nth-child(2){flex:1}
.app[data-layout="mobile"] .top .ctl{width:100%;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch;gap:6px}
.app[data-layout="mobile"] .top .ctl::-webkit-scrollbar{display:none}
.app[data-layout="mobile"] .top .ctl>*{flex:none}
.app[data-layout="mobile"] .top .ctl{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-inline-end:24px}
html[dir="rtl"] .app[data-layout="mobile"] .top .ctl{-webkit-mask-image:linear-gradient(270deg,#000 88%,transparent);mask-image:linear-gradient(270deg,#000 88%,transparent)}
.app[data-layout="mobile"] .top .tg button{padding:5px 9px}
.app[data-layout="mobile"] .top .tg button span,.app[data-layout="mobile"] .pdfbtn span,.app[data-layout="mobile"] .acct span:not(.av){display:none}
.app[data-layout="mobile"] .top .sel{max-width:160px}
.app.narrow .laytg{display:none}
.app.narrow[data-layout="mobile"]{max-width:none;border-inline:0;box-shadow:none}
.app[data-layout="mobile"] .dock button{flex:1;min-width:0}
.app[data-layout="mobile"] .dock button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app[data-layout="mobile"] .card{padding:14px}
.app[data-layout="mobile"] .sec-title{font-size:19px}
/* "More" sheet */
.modal.sheet-wrap{place-items:end center;padding:0}
.sheet{width:min(520px,100%)!important;border-radius:20px 20px 0 0!important;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px))!important}
.sheet-grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet-grid button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:12px;text-align:center;color:var(--ink2)}
.sheet-grid button svg{width:22px;height:22px}
.sheet-grid button[aria-current="page"]{color:var(--neon);border-color:rgba(255,43,214,.5)}
.sheet-set{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
@media(max-width:420px){body:not(.pdfmode) .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}body:not(.pdfmode) .kpi .v{font-size:18px}body:not(.pdfmode) .top .tg button span{display:none}}
</style>
</head>
<body>
<div class="fx" aria-hidden="true"><i></i><i></i><b></b></div>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="dock" id="dock"></nav>
</div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<div id="modal-root"></div>
<noscript><p style="padding:24px;color:#fff">Kinzhal Nest needs JavaScript.</p></noscript>
<script src="/app.js" defer></script>
<script type="module" src="/cloud.js"></script>
</body>
</html>
