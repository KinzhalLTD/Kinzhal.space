# Kinzhal Nest on Netlify: static app in /public, API + nightly sync as functions.
[build]
  publish = "public"
  functions = "netlify/functions"

# The Firebase project ID, app ID and web API key are public by design (every Firebase web app sends them to the browser),
# so Netlify's secret scanner should not block a deploy when they appear. The private key and APP_SECRET stay scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,FIREBASE_APP_ID,FIREBASE_WEB_API_KEY"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://api.pwnedpasswords.com https://www.gstatic.com; frame-src https://*.firebaseapp.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
